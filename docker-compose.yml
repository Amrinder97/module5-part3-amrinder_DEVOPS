
services:

  # MongoDB Database
  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db

  # Python Flask Banking Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank_app
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your .env file}
    depends_on:
      - mongo

  # JavaScript Transactions Microservice
  transactions:
    build:
      context: ./transactions
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - PORT=3000
    depends_on:
      - mongo
      - backend

  # Student Portfolio Frontend
  frontend:
    build:
      context: ./studentportfolio
      dockerfile: Dockerfile
    depends_on:
      - backend
      - transactions

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - transactions

volumes:
  mongo_data:
