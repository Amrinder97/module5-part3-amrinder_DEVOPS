
server {
    listen 80;
    server_name localhost;

    # Verify the logged-in user before allowing transaction access
    location = /internal/verify-transactions {
        internal;

        proxy_pass http://backend:5000/api/verify-transaction-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Requested-User-ID $tx_user_id;
    }

    # JavaScript Transactions Microservice
    location ~ ^/api/transactions/(?<tx_user_id>[0-9a-fA-F]{24})$ {
        auth_request /internal/verify-transactions;

        proxy_pass http://transactions:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reject other transaction URLs rather than sending them to Flask
    location /api/transactions {
        return 404;
    }

    # Flask Banking Backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Student Portfolio Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
